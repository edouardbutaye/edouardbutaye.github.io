<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Édouard Butaye, research scientist and CFD solver developer</title>
  <meta name="description" content="Édouard Butaye, research scientist and CFD solver developer" />

  <!-- Open Graph and Twitter card: what LinkedIn, Slack, X and many mail
       clients show when this URL is shared. The URLs must be absolute,
       because the scraper resolves them from its own server. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Édouard Butaye" />
  <meta property="og:locale" content="en_GB" />
  <meta property="og:locale:alternate" content="fr_FR" />
  <meta property="og:url" content="https://edouardbutaye.github.io/" />
  <meta property="og:title" content="Édouard Butaye, research scientist and CFD solver developer" />
  <meta property="og:description" content="Research and CFD solver development for turbulent and multiphase flows." />
  <meta property="og:image" content="https://edouardbutaye.github.io/images/og-card.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Édouard Butaye, research scientist and CFD solver developer" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- This page is a gate, not content: the indexable versions are the two
       language editions. x-default names the one to show when no language
       matches, which is the English site. -->
  <link rel="alternate" hreflang="en" href="https://edouardbutaye.github.io/en/index.html" />
  <link rel="alternate" hreflang="fr" href="https://edouardbutaye.github.io/fr/index.html" />
  <link rel="alternate" hreflang="x-default" href="https://edouardbutaye.github.io/en/index.html" />

  <link rel="icon" href="images/favicon.ico" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon-180x180.png" />

  <!-- Without JavaScript the redirect cannot consult the browser's language,
       so it falls back to English, the default. One second rather than zero:
       an instant refresh is a back-button trap, because going "back" to this
       page immediately throws the visitor forward again. -->
  <noscript>
    <meta http-equiv="refresh" content="1; url=en/index.html" />
  </noscript>

  <!-- Runs before the body paints, so the visitor does not see this page at
       all in the normal case. An explicit choice made with the EN/FR switch
       wins over the browser's own setting; navigator.language decides only
       for a first-time visitor.

       location.replace(), NOT location.href: replace() overwrites this page
       in the session history instead of adding to it, so pressing Back from
       /en/ returns to wherever the visitor came from rather than landing
       here and being redirected straight out again. -->
  <script>
    (function () {
      var lang = null;

      try {
        var saved = localStorage.getItem("lang");
        if (saved === "en" || saved === "fr") lang = saved;
      } catch (e) { /* private mode, storage disabled - fall through */ }

      if (!lang) {
        /* navigator.languages is the visitor's ordered list of preferences;
           navigator.language is the single best guess older browsers give.
           Only the primary subtag matters here: "fr-CA" is as French as
           "fr". */
        var preferred = (navigator.languages && navigator.languages.length)
          ? navigator.languages
          : [navigator.language || "en"];

        for (var i = 0; i < preferred.length; i++) {
          var tag = String(preferred[i]).toLowerCase();
          if (tag.indexOf("fr") === 0) { lang = "fr"; break; }
          if (tag.indexOf("en") === 0) { lang = "en"; break; }
        }
      }

      location.replace((lang === "fr" ? "fr" : "en") + "/index.html");
    })();
  </script>

  <!-- Self-contained rather than reading css/style.css: this page is meant to
       be gone before it finishes painting, and pulling in the full stylesheet
       would make it flash on a slow connection. -->
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --text: #24262b;
      --accent: #6b4ea6;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17181c;
        --text: #e4e5e9;
        --accent: #b49ae8;
      }
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 2rem;
    }

    a {
      color: var(--accent);
      font-size: 1.1rem;
    }

    .choices {
      display: flex;
      gap: 1.5rem;
    }
  </style>
</head>
<body>
  <!-- Only ever seen if both the script and the meta refresh fail. It is a
       real choice rather than an error message, so the visitor is never
       stranded at the root. -->
  <p>Édouard Butaye</p>
  <p class="choices">
    <a href="en/index.html" hreflang="en">English</a>
    <a href="fr/index.html" hreflang="fr" lang="fr">Français</a>
  </p>
</body>
</html>
