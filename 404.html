<!DOCTYPE html>
<!--
  MAINTENANCE PAGE (branch: maintenance)

  Deliberately self-contained: the styles are inline and the only
  external files are the favicon and the profile photo. It therefore
  cannot be broken by a change to css/style.css or js/main.js, which is
  the point of a page whose job is to work when the rest does not.

  404.html is a copy of this file, so a deep link to a page that no
  longer exists on this branch shows the same notice rather than the
  GitHub Pages error page.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Back soon &middot; Édouard Butaye</title>
  <meta name="description" content="Édouard Butaye's website is being updated and will be back shortly." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="images/favicon.ico" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon-180x180.png" />
  <style>
    :root {
      color-scheme: light dark;
      --color-bg: #ffffff;
      --color-bg-alt: #f6f6f8;
      --color-text: #24262b;
      --color-text-muted: #6b6f76;
      --color-accent: #6b4ea6;
      --color-border: #e3e3e8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #17181c;
        --color-bg-alt: #1f2126;
        --color-text: #e4e5e9;
        --color-text-muted: #9ea3ad;
        --color-accent: #b49ae8;
        --color-border: #2d3037;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Helvetica, Arial, sans-serif;
    }

    .panel {
      width: 100%;
      max-width: 30rem;
      text-align: center;
    }

    .panel img {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 1.5rem;
      display: block;
      border: 3px solid var(--color-bg);
      box-shadow: 0 0 0 1px var(--color-border);
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.6rem;
      letter-spacing: -0.01em;
    }

    .name {
      margin: 0 0 2rem;
      color: var(--color-text-muted);
      font-size: 0.95rem;
    }

    p.message {
      margin: 0 0 2rem;
      color: var(--color-text-muted);
    }

    /* Three dots that fade in turn, so the page reads as "in progress"
       rather than as an error. Suppressed for anyone who has asked their
       system to reduce motion. */
    .dots {
      display: flex;
      gap: 0.4rem;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--color-accent);
      opacity: 0.25;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 100% { opacity: 0.25; }
      50%      { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .dots span { animation: none; opacity: 0.5; }
    }

    .contact {
      padding-top: 1.5rem;
      border-top: 1px solid var(--color-border);
      font-size: 0.9rem;
      color: var(--color-text-muted);
    }

    .contact a {
      color: var(--color-accent);
      text-decoration: none;
      white-space: nowrap;
    }

    .contact a:hover { text-decoration: underline; }

    .contact .sep { padding: 0 0.5rem; opacity: 0.5; }
  </style>
</head>
<body>
  <main class="panel">
    <img src="images/profile.jpg" alt="Photo of Édouard Butaye" />

    <h1>Back soon</h1>
    <p class="name">Édouard Butaye &middot; research scientist and CFD solver developer</p>

    <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>

    <p class="message">
      This site is being updated and will be available again shortly.
      Thank you for your patience.
    </p>

    <p class="contact">
      In the meantime, you can reach me at
      <a href="mailto:ebutaye@sfr.fr">ebutaye@sfr.fr</a>
      <span class="sep">&middot;</span>
      <a href="https://orcid.org/0000-0003-3111-9904" target="_blank" rel="noopener">ORCID</a>
      <span class="sep">&middot;</span>
      <a href="https://scholar.google.com/citations?user=UcFZ37EAAAAJ&amp;hl=fr" target="_blank" rel="noopener">Google&nbsp;Scholar</a>
      <span class="sep">&middot;</span>
      <a href="https://www.linkedin.com/in/edouard-butaye" target="_blank" rel="noopener">LinkedIn</a>
    </p>
  </main>
</body>
</html>
